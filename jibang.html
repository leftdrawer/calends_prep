<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee5d1">
  <title>광산김씨·창녕성씨 합동지방 · 은호당</title>
  <style>
    /* 앱과 같은 따뜻한 중성·놋빛 팔레트. 지방 그림의 닥종이 바탕은 유지합니다. */
    :root{color-scheme:light dark;--accent:#725534;--accent-deep:#654A2D;--panel:#EFECE7;--panel-line:#BBB2A8;--panel-ink:#2D2925;--panel-ink-2:#5A554E;--on-accent:#F5F1EA}
    @media(prefers-color-scheme:dark){:root{--accent:#785B38;--accent-deep:#E2C99A;--panel:#252528;--panel-line:#403E3D;--panel-ink:#E9E4DC;--panel-ink-2:#BEB7AE}}
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#eee5d1}
    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--panel-ink)}
    main{width:100%;height:100%;height:100dvh;display:grid;place-items:center}
    #jibang{display:block;width:100%;height:100%;object-fit:contain}
    #controls{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 32px));padding:14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 3px 20px rgba(23,21,28,.14)}
    #controls p{margin:0 0 10px;font-size:13px;line-height:1.6;word-break:keep-all;color:var(--panel-ink-2)}
    .actions{display:flex;flex-wrap:wrap;gap:8px}
    button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid var(--panel-line);border-radius:999px;background:var(--panel);color:var(--accent-deep);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
    #fullscreen{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
    button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    #status{margin:10px 0 0!important;color:var(--panel-ink-2)}
    #show-controls{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:44px;height:44px;padding:0;background:var(--panel);font-size:22px}
  </style>
</head>
<body>
  <main aria-label="두 집안 역대 조상님을 함께 모시는 지방">
    <img id="jibang" src="./assets/jungyang-jibang-s25-ultra.png?v=20261020-aligned" alt="닥종이 바탕의 붓글씨 합동지방. 오른쪽 광산김씨 역대 조상님의 신위(光山金氏歷代祖先神位), 왼쪽 창녕성씨 역대 조상님의 신위(昌寧成氏歷代祖先神位).">
  </main>
  <section id="controls" aria-label="지방 화면 설정">
    <p>휴대전화를 세로로 두고 전체 화면을 누르세요. 화면을 터치하면 설정을 다시 열 수 있습니다.</p>
    <div class="actions">
      <button id="fullscreen" type="button">전체 화면</button>
      <a href="./assets/jungyang-jibang-s25-ultra.png?v=20261020-aligned" download="광산김씨-창녕성씨-합동지방.png">PNG 저장</a>
      <button id="hide-controls" type="button">설정 숨기기</button>
    </div>
    <p id="status" role="status" hidden></p>
  </section>
  <button id="show-controls" type="button" aria-label="지방 화면 설정 열기" hidden>⋯</button>
  <script>
    const controls=document.getElementById('controls');
    const show=document.getElementById('show-controls');
    const status=document.getElementById('status');
    const fullscreen=document.getElementById('fullscreen');
    function setControls(visible){
      controls.hidden=!visible;
      show.hidden=visible||!!document.fullscreenElement;
      if(visible)fullscreen.focus({preventScroll:true});
    }
    document.getElementById('hide-controls').onclick=()=>setControls(false);
    show.onclick=()=>setControls(true);
    document.getElementById('jibang').onclick=()=>setControls(controls.hidden);
    fullscreen.onclick=async()=>{
      try{
        if(!document.fullscreenElement){
          if(!document.documentElement.requestFullscreen)throw new Error('unsupported');
          await document.documentElement.requestFullscreen({navigationUI:'hide'});
        }
        status.hidden=true;
        setControls(false);
      }catch(error){
        status.hidden=false;
        status.textContent='이 브라우저에서는 전체 화면을 열 수 없습니다. PNG를 저장해 갤러리에서 열어주세요.';
      }
    };
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement)setControls(true);
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&!document.fullscreenElement)setControls(true);
    });
    document.getElementById('jibang').onerror=()=>{
      status.hidden=false;status.textContent='지방 이미지를 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
      setControls(true);
    };
  </script>
</body>
</html>
