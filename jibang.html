<!doctype html>
<html lang="ko" data-astryx-theme="stone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eee5d1">
  <title>광산김씨·창녕성씨 합동지방 · 은호당</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/astryx-theme-stone-0.7.16.css">
  <style>
    /* 설정 패널은 Astryx Stone 토큰. 지방 그림의 닥종이 바탕 #eee5d1 은 유지합니다. */
    :root{color-scheme:light dark;--font-weight-normal:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700}
    :root[data-theme="dark"]{color-scheme:dark}
    :root[data-theme="light"]{color-scheme:light}
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#eee5d1}
    body{font-family:Figtree,"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--color-text-primary);font-size:max(1rem,var(--text-body-size));line-height:max(1.6,var(--text-body-leading))}
    main{width:100%;height:100%;height:100dvh;display:grid;place-items:center}
    #jibang{display:block;width:100%;height:100%;object-fit:contain}
    #controls{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 32px));padding:14px;background:var(--color-background-card);border:1px solid var(--color-border);border-radius:var(--radius-container);box-shadow:var(--shadow-med);color:var(--color-text-primary)}
    #controls p{margin:0 0 10px;font-size:max(.75rem,var(--text-supporting-size));line-height:1.6;word-break:keep-all;color:var(--color-text-secondary)}
    .actions{display:flex;flex-wrap:wrap;gap:8px}
    button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid var(--color-border-emphasized);border-radius:var(--radius-full);background:var(--color-background-card);color:var(--color-text-accent);font:inherit;font-size:max(.75rem,var(--text-supporting-size));font-weight:600;cursor:pointer;text-decoration:none}
    #fullscreen{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
    button:focus-visible,a:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
    #status{margin:10px 0 0!important;color:var(--color-text-secondary)}
    #show-controls{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:44px;height:44px;padding:0;background:var(--color-background-card);font-size:22px}
  </style>
  <script>
  try{var themeChoice=localStorage.getItem('sangbogi:theme');if(themeChoice==='light'||themeChoice==='dark')document.documentElement.setAttribute('data-theme',themeChoice);}catch(e){}
  </script>
</head>
<body>
  <main aria-label="두 집안 역대 조상님을 함께 모시는 지방">
    <img id="jibang" src="./assets/jungyang-jibang-s25-ultra.png?v=20261020-aligned" alt="닥종이 바탕의 붓글씨 합동지방. 오른쪽 광산김씨 역대 조상님의 신위(光山金氏歷代祖先神位), 왼쪽 창녕성씨 역대 조상님의 신위(昌寧成氏歷代祖先神位).">
  </main>
  <section id="controls" aria-label="지방 화면 설정">
    <p>휴대전화를 세로로 두고 전체 화면을 누르세요. 화면을 터치하면 설정을 다시 열 수 있습니다.</p>
    <div class="actions">
      <button id="fullscreen" type="button">전체 화면</button>
      <a href="./assets/jungyang-jibang-s25-ultra.png?v=20261020-aligned" download="광산김씨-창녕성씨-합동지방.png">PNG 저장</a>
      <button id="hide-controls" type="button">설정 숨기기</button>
    </div>
    <p id="status" role="status" hidden></p>
  </section>
  <button id="show-controls" type="button" aria-label="지방 화면 설정 열기" hidden>⋯</button>
  <script>
    const controls=document.getElementById('controls');
    const show=document.getElementById('show-controls');
    const status=document.getElementById('status');
    const fullscreen=document.getElementById('fullscreen');
    function setControls(visible){
      controls.hidden=!visible;
      show.hidden=visible||!!document.fullscreenElement;
      if(visible)fullscreen.focus({preventScroll:true});
    }
    document.getElementById('hide-controls').onclick=()=>setControls(false);
    show.onclick=()=>setControls(true);
    document.getElementById('jibang').onclick=()=>setControls(controls.hidden);
    fullscreen.onclick=async()=>{
      try{
        if(!document.fullscreenElement){
          if(!document.documentElement.requestFullscreen)throw new Error('unsupported');
          await document.documentElement.requestFullscreen({navigationUI:'hide'});
        }
        status.hidden=true;
        setControls(false);
      }catch(error){
        status.hidden=false;
        status.textContent='이 브라우저에서는 전체 화면을 열 수 없습니다. PNG를 저장해 갤러리에서 열어주세요.';
      }
    };
    document.addEventListener('fullscreenchange',()=>{
      if(!document.fullscreenElement)setControls(true);
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&!document.fullscreenElement)setControls(true);
    });
    document.getElementById('jibang').onerror=()=>{
      status.hidden=false;status.textContent='지방 이미지를 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
      setControls(true);
    };
  </script>
</body>
</html>
